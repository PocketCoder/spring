name: CI

# One workflow for everything:
#   check     every push and pull request: build, run SpringChecks, bundle the app and make sure it launches
#   nightly   push to main: replaces the rolling `nightly` pre-release with a universal, ad-hoc signed build
#   release   tag v*: a versioned release with the same build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# A newer pull request push supersedes the older run; pushes to main finish (they may be publishing).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, check and bundle
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Build
        run: swift build

      - name: SpringChecks
        run: swift run SpringChecks

      - name: Bundle Spring.app
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # A release tag must match VERSION, so the app never reports a different number from its tag.
            [ "$version" = "$base" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($base)"; exit 1; }
          else
            version="$base-nightly.${{ github.run_number }}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} scripts/bundle.sh "$version"

      # A build that cannot start must never be published: launch it for a few seconds and fail on a dyld error.
      - name: Launch check
        run: |
          set -u
          build/Spring.app/Contents/MacOS/Spring >launch.log 2>&1 &
          pid=$!
          sleep 8
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat launch.log
          if grep -qiE "Library not loaded|dyld\[|Symbol not found" launch.log; then
            echo "::error::Spring failed to load at launch"
            exit 1
          fi

      - name: Package zip
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p out
          ditto -c -k --keepParent build/Spring.app "out/Spring-$VERSION-macOS.zip"
          echo "$VERSION" > out/version.txt

      # Sparkle checks every update against the public key in the app, so the zip is signed with the matching private
      # key (SPARKLE_PRIVATE_KEY). The signature travels in out/ for the publish job's appcast; it is not uploaded.
      - name: Sign update (Sparkle)
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set, so no update feed is published"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          .build/artifacts/sparkle/Sparkle/bin/sign_update "out/Spring-$VERSION-macOS.zip" --ed-key-file "$RUNNER_TEMP/sparkle.key" | tee out/sparkle-sig.txt
          rm -f "$RUNNER_TEMP/sparkle.key"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: spring-macos
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: spring-macos
          path: out

      - name: Nightly (rolling pre-release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/*.zip --prerelease --target "$GITHUB_SHA" \
            --title "Spring nightly" \
            --notes "Built from ${GITHUB_SHA::7}. Ad-hoc signed: right-click the app and choose Open the first time."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip --title "Spring $GITHUB_REF_NAME" --generate-notes

      # SUFeedURL in the app points here. sparkle:version is the build number (CFBundleVersion = run number).
      - name: Write nightly-appcast.xml
        if: github.ref == 'refs/heads/main' && hashFiles('out/sparkle-sig.txt') != ''
        run: |
          set -euo pipefail
          version="$(cat out/version.txt)"
          sig="$(tr -d '\n' < out/sparkle-sig.txt)"
          mkdir -p pages
          cat > pages/nightly-appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Spring nightly</title>
              <item>
                <title>${version}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <link>https://github.com/${{ github.repository }}/commit/${{ github.sha }}</link>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/nightly/Spring-${version}-macOS.zip" ${sig} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          cat pages/nightly-appcast.xml

      - name: Publish the feed to gh-pages
        if: hashFiles('pages/*') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: pages
          keep_files: true
